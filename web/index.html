<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff9f0" />
    <title>Livewall</title>

    <!--
      Apply the stored theme BEFORE first paint, so a dark-mode user never sees a
      cream flash while the bundle loads. Keep the storage key and the two colours
      in sync with src/livewall/theme.ts and tokens.css.
    -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('daylight-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var bg = dark ? '#171225' : '#fff9f0';
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var s = document.createElement('style');
          s.textContent = 'html,body{background:' + bg + ' !important;}';
          document.head.appendChild(s);
          var m = document.querySelector('meta[name=theme-color]');
          if (m) m.setAttribute('content', bg);
        } catch (e) {
          /* storage unavailable — the first React render still resolves the theme */
        }
      })();
    </script>

    <!-- Daylight typefaces: Bricolage Grotesque (display), DM Sans (body),
         IBM Plex Mono (all numbers). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
