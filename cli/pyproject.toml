[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "livewall-cli"
version = "0.0.1"
description = "Command-line client for Livewall — an agent-programmable live status surface"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashutosh Varma" }]
keywords = ["livewall", "dashboard", "cli", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Environment :: Console",
]
dependencies = []

[project.scripts]
livewall = "livewall:main"

[tool.setuptools]
py-modules = ["livewall"]
